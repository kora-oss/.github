<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="glowLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 72px;
      font-weight: 900;
      letter-spacing: 6px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 2.5px;
      fill: #94a3b8;
    }
    .tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.5px;
      fill: #38bdf8;
    }
  </style>

  <!-- Background Base -->
  <rect width="1280" height="480" fill="url(#bgGradient)"/>

  <!-- Subtle Grid Overlay -->
  <rect width="1280" height="480" fill="url(#techGrid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="120" r="180" fill="#38bdf8" opacity="0.08" filter="url(#neonGlow)"/>
  <circle cx="1100" cy="380" r="220" fill="#a855f7" opacity="0.09" filter="url(#neonGlow)"/>
  <circle cx="950" cy="140" r="140" fill="#06b6d4" opacity="0.07" filter="url(#neonGlow)"/>

  <!-- Decorative Circuit / Flow Lines -->
  <g opacity="0.6">
    <path d="M 0 380 Q 320 320 640 370 T 1280 320" fill="none" stroke="url(#glowLineGrad)" stroke-width="2"/>
    <path d="M 0 410 Q 400 350 800 420 T 1280 380" fill="none" stroke="url(#glowLineGrad)" stroke-width="1.5" opacity="0.5"/>
    <path d="M 150 0 L 150 180 L 220 250" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="220" cy="250" r="3.5" fill="#38bdf8"/>

    <path d="M 1120 480 L 1120 320 L 1050 250" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="1050" cy="250" r="3.5" fill="#c084fc"/>
  </g>

  <!-- Badge Pill -->
  <g transform="translate(640, 95)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="-110" cy="0" r="5" fill="#10b981" filter="url(#softGlow)"/>
    <text x="10" y="5" text-anchor="middle" class="tag">OPEN SOURCE ECOSYSTEM</text>
  </g>

  <!-- Central Logo Mark -->
  <g transform="translate(640, 195)">
    <!-- Hex / Diamond Node Shield -->
    <path d="M 0 -50 L 45 -25 L 45 25 L 0 50 L -45 25 L -45 -25 Z" fill="#0f172a" stroke="url(#brandGrad)" stroke-width="3.5" filter="url(#softGlow)"/>
    <!-- Inner K Icon stylized -->
    <path d="M -14 -22 L -14 22 M -14 0 L 14 -22 M -3 0 L 16 22" fill="none" stroke="url(#accentCyan)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(640, 305)">
    <text x="0" y="0" text-anchor="middle" class="title" fill="url(#brandGrad)" filter="url(#softGlow)">KORA OSS</text>
  </g>

  <!-- Tagline -->
  <g transform="translate(640, 350)">
    <text x="0" y="0" text-anchor="middle" class="subtitle">Next-Gen Developer Tools, Payments &amp; Open Source Primitives</text>
  </g>

  <!-- Tech Stack Chips -->
  <g transform="translate(640, 405)" opacity="0.85">
    <!-- Chip 1: Node.js -->
    <g transform="translate(-160, 0)">
      <rect x="-55" y="-14" width="110" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="12" fill="#38bdf8">Node.js</text>
    </g>
    <!-- Chip 2: Billing & Pay -->
    <g transform="translate(0, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="12" fill="#818cf8">Billing Infra</text>
    </g>
    <!-- Chip 3: Mentorship -->
    <g transform="translate(165, 0)">
      <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="12" fill="#34d399">Community</text>
    </g>
  </g>

  <!-- Subtle Border Frame -->
  <rect x="0.5" y="0.5" width="1279" height="479" rx="0" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.3"/>
</svg>
